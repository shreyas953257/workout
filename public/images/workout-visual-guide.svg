<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07080c"/><stop offset=".55" stop-color="#10131b"/><stop offset="1" stop-color="#050609"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6a2a"/><stop offset="1" stop-color="#ff2d55"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".38"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <style>
    .t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{font-family:Inter,Arial,sans-serif;fill:#94a3b8}
    .small{font-family:Inter,Arial,sans-serif;fill:#cbd5e1;font-size:13px;font-weight:650;letter-spacing:.4px}
    .label{font-family:Inter,Arial,sans-serif;fill:#fff;font-size:18px;font-weight:850;letter-spacing:.2px}
    .line{stroke:#cbd5e1;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
    .body{fill:#dbe3ed;stroke:#aeb9c8;stroke-width:3}
    .muscle{fill:#ff6336;filter:url(#glow)}
    .equipment{stroke:#64748b;stroke-width:10;stroke-linecap:round}
  </style>
</defs>

<rect width="1400" height="820" rx="34" fill="url(#bg)"/>
<rect width="1400" height="820" rx="34" fill="url(#grid)"/>

<g transform="translate(56 48)">
  <text class="m" font-size="13" font-weight="800" letter-spacing="4">FORGE · TRAINING VISUAL</text>
  <text class="t" y="48" font-size="38" font-weight="900">YOUR 5-DAY SPLIT</text>
  <text class="m" y="76" font-size="15">A visual map of the major movements in your weekly rotation</text>
  <rect x="1050" y="18" width="230" height="42" rx="21" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="1076" cy="39" r="6" fill="#ff6336"/><text class="small" x="1092" y="44">MUSCLE FOCUS</text>
</g>

<!-- card 1 -->
<g filter="url(#shadow)">
<rect x="45" y="150" width="250" height="610" rx="28" fill="#0b0e14" stroke="#ff5a35" stroke-opacity=".6"/>
<rect x="45" y="150" width="250" height="7" rx="4" fill="url(#orange)"/>
<text class="m" x="70" y="190" font-size="12" font-weight="800" letter-spacing="2">DAY 01</text>
<text class="label" x="70" y="220">CHEST + TRICEPS</text>
<g transform="translate(55 260)">
  <path class="equipment" d="M20 275H205"/><path class="equipment" d="M48 275L70 205"/><path class="equipment" d="M175 275L153 205"/>
  <path class="equipment" d="M72 205L155 205"/>
  <circle cx="113" cy="120" r="25" class="body"/>
  <path d="M86 150 Q113 132 140 150 L151 205 L113 225 L75 205Z" class="body"/>
  <path class="line" d="M88 160L58 198M138 160L169 198"/>
  <path class="line" d="M91 210L74 270M135 210L151 270"/>
  <ellipse cx="91" cy="164" rx="15" ry="11" class="muscle"/><ellipse cx="135" cy="164" rx="15" ry="11" class="muscle"/>
  <ellipse cx="77" cy="211" rx="9" ry="17" class="muscle"/>
</g>
<text class="m" x="70" y="585" font-size="11" letter-spacing="1.4">PRIMARY MOVEMENTS</text>
<text class="small" x="70" y="615">Bench Press</text><text class="small" x="70" y="642">Incline Press</text><text class="small" x="70" y="669">Chest Fly</text><text class="small" x="70" y="696">Tricep Pushdown</text>
<rect x="70" y="716" width="112" height="25" rx="12" fill="#ff6336" fill-opacity=".12"/><text x="82" y="733" fill="#ff8a65" font-family="Inter,Arial" font-size="10" font-weight="800">3–4 SETS</text>
</g>

<!-- card 2 -->
<g filter="url(#shadow)">
<rect x="315" y="150" width="250" height="610" rx="28" fill="#0b0e14" stroke="#7c5cff" stroke-opacity=".65"/>
<rect x="315" y="150" width="250" height="7" rx="4" fill="url(#purple)"/>
<text class="m" x="340" y="190" font-size="12" font-weight="800" letter-spacing="2">DAY 02</text>
<text class="label" x="340" y="220">BACK + BICEPS</text>
<g transform="translate(325 260)">
  <path class="equipment" d="M36 48V270M190 48V270M36 48H190"/><path class="equipment" d="M78 75H148"/>
  <circle cx="113" cy="126" r="25" class="body"/>
  <path d="M88 154 Q113 137 138 154 L147 216 L113 238 L79 216Z" class="body"/>
  <path class="line" d="M91 163L76 78M135 163L150 78"/>
  <path class="line" d="M95 222L80 282M131 222L146 282"/>
  <path d="M76 78Q113 58 150 78" fill="none" stroke="#aeb9c8" stroke-width="10" stroke-linecap="round"/>
  <path d="M76 78Q113 98 150 78" fill="none" stroke="#ff6336" stroke-opacity=".85" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <ellipse cx="92" cy="165" rx="9" ry="19" class="muscle"/><ellipse cx="134" cy="165" rx="9" ry="19" class="muscle"/>
</g>
<text class="m" x="340" y="585" font-size="11" letter-spacing="1.4">PRIMARY MOVEMENTS</text>
<text class="small" x="340" y="615">Lat Pulldown</text><text class="small" x="340" y="642">Cable Row</text><text class="small" x="340" y="669">Barbell Curl</text><text class="small" x="340" y="696">Hammer Curl</text>
<rect x="340" y="716" width="112" height="25" rx="12" fill="#8b5cf6" fill-opacity=".13"/><text x="352" y="733" fill="#b8a6ff" font-family="Inter,Arial" font-size="10" font-weight="800">3–4 SETS</text>
</g>

<!-- card 3 -->
<g filter="url(#shadow)">
<rect x="585" y="150" width="250" height="610" rx="28" fill="#0b0e14" stroke="#22d3ee" stroke-opacity=".62"/>
<rect x="585" y="150" width="250" height="7" rx="4" fill="url(#cyan)"/>
<text class="m" x="610" y="190" font-size="12" font-weight="800" letter-spacing="2">DAY 03</text>
<text class="label" x="610" y="220">LEGS</text>
<g transform="translate(595 260)">
  <circle cx="113" cy="115" r="25" class="body"/>
  <path d="M87 145 Q113 132 139 145 L145 208 L113 232 L81 208Z" class="body"/>
  <path class="line" d="M91 156L61 205M135 156L165 205"/>
  <path class="line" d="M96 215L75 276M130 215L151 276"/>
  <path class="line" d="M75 276L48 276M151 276L178 276"/>
  <ellipse cx="98" cy="220" rx="13" ry="19" class="muscle"/><ellipse cx="128" cy="220" rx="13" ry="19" class="muscle"/>
  <ellipse cx="78" cy="255" rx="10" ry="23" class="muscle"/><ellipse cx="148" cy="255" rx="10" ry="23" class="muscle"/>
  <path d="M38 298H188" stroke="#1e293b" stroke-width="3"/>
</g>
<text class="m" x="610" y="585" font-size="11" letter-spacing="1.4">PRIMARY MOVEMENTS</text>
<text class="small" x="610" y="615">Back Squat</text><text class="small" x="610" y="642">Leg Press</text><text class="small" x="610" y="669">Leg Curl</text><text class="small" x="610" y="696">Calf Raise</text>
<rect x="610" y="716" width="112" height="25" rx="12" fill="#22d3ee" fill-opacity=".12"/><text x="622" y="733" fill="#67e8f9" font-family="Inter,Arial" font-size="10" font-weight="800">3–4 SETS</text>
</g>

<!-- card 4 -->
<g filter="url(#shadow)">
<rect x="855" y="150" width="250" height="610" rx="28" fill="#0b0e14" stroke="#34d399" stroke-opacity=".65"/>
<rect x="855" y="150" width="250" height="7" rx="4" fill="url(#green)"/>
<text class="m" x="880" y="190" font-size="12" font-weight="800" letter-spacing="2">DAY 04</text>
<text class="label" x="880" y="220">SHOULDERS</text>
<g transform="translate(865 260)">
  <path class="equipment" d="M40 70H186"/><path class="equipment" d="M113 70V36"/>
  <circle cx="113" cy="125" r="25" class="body"/>
  <path d="M87 153 Q113 136 139 153 L145 215 L113 236 L81 215Z" class="body"/>
  <path class="line" d="M91 160L66 91M135 160L160 91"/>
  <path class="line" d="M96 218L79 278M130 218L147 278"/>
  <ellipse cx="88" cy="159" rx="16" ry="11" class="muscle"/><ellipse cx="138" cy="159" rx="16" ry="11" class="muscle"/>
</g>
<text class="m" x="880" y="585" font-size="11" letter-spacing="1.4">PRIMARY MOVEMENTS</text>
<text class="small" x="880" y="615">Shoulder Press</text><text class="small" x="880" y="642">Lateral Raise</text><text class="small" x="880" y="669">Front Raise</text><text class="small" x="880" y="696">Reverse Fly</text>
<rect x="880" y="716" width="112" height="25" rx="12" fill="#34d399" fill-opacity=".12"/><text x="892" y="733" fill="#6ee7b7" font-family="Inter,Arial" font-size="10" font-weight="800">3–4 SETS</text>
</g>

<!-- card 5 -->
<g filter="url(#shadow)">
<rect x="1125" y="150" width="230" height="610" rx="28" fill="#0b0e14" stroke="#ff4d8d" stroke-opacity=".62"/>
<rect x="1125" y="150" width="230" height="7" rx="4" fill="url(#orange)"/>
<text class="m" x="1150" y="190" font-size="12" font-weight="800" letter-spacing="2">DAY 05</text>
<text class="label" x="1150" y="220">ARMS</text>
<g transform="translate(1135 260)">
  <circle cx="105" cy="120" r="25" class="body"/>
  <path d="M80 149 Q105 133 130 149 L139 214 L105 235 L71 214Z" class="body"/>
  <path class="line" d="M86 158L55 220M124 158L155 220"/>
  <path class="line" d="M94 218L78 278M116 218L132 278"/>
  <ellipse cx="65" cy="203" rx="10" ry="23" class="muscle"/><ellipse cx="145" cy="203" rx="10" ry="23" class="muscle"/>
  <path class="equipment" d="M45 226H75M135 226H165"/>
</g>
<text class="m" x="1150" y="585" font-size="11" letter-spacing="1.4">PRIMARY MOVEMENTS</text>
<text class="small" x="1150" y="615">Barbell Curl</text><text class="small" x="1150" y="642">Hammer Curl</text><text class="small" x="1150" y="669">Preacher Curl</text><text class="small" x="1150" y="696">Overhead Extension</text>
<rect x="1150" y="716" width="112" height="25" rx="12" fill="#ff4d8d" fill-opacity=".12"/><text x="1162" y="733" fill="#ff8ab5" font-family="Inter,Arial" font-size="10" font-weight="800">3–4 SETS</text>
</g>
</svg>